    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" media="(prefers-color-scheme: light)" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e9e4d8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141414" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MainaVoice" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mainavoice.lat/" />
    <meta property="og:title" content="Maina Voice — Speech to Text &amp; Model Benchmarking" />
    <meta property="og:description" content="Compare speech-to-text engines side by side, measure latency, and keep recordings private with local IndexedDB storage." />
    <meta property="og:image" content="https://mainavoice.lat/og-image.png" />
    <meta property="og:site_name" content="Maina Voice" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://mainavoice.lat/" />
    <meta name="twitter:title" content="Maina Voice — Speech to Text &amp; Model Benchmarking" />
    <meta name="twitter:description" content="Speech to text dictation and multi-engine speed benchmarking with local IndexedDB privacy." />
    <meta name="twitter:image" content="https://mainavoice.lat/og-image.png" />

    <!-- Self-hosted fonts (preloaded for fastest FCP) -->
    <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/jetbrains-mono-400.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Inline critical CSS to avoid render-blocking external CSS for first paint -->
    <style>
      :root{font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-text-size-adjust:100%;--bg:#e9e4d8;--fg:#1e1e1e;--card:#f4efe4;--bd:#d2cbbb;--pri:#2e2e2e;--mut:#5e5a52}
      html.dark{--bg:#141414;--fg:#e8e3da;--card:#1c1c1c;--bd:#2c2c2c;--pri:#d1cfc0;--mut:#8e8a83}
      *{box-sizing:border-box}
      html{height:100%;font-size:16px;background:var(--bg)}
      body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:'Inter',system-ui,-apple-system,sans-serif;letter-spacing:.01em;overflow-x:hidden}
      #boot-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);text-align:center;padding:1.5rem}
      #boot-splash .bs-box{width:5rem;height:5rem;border-radius:1rem;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--bd);margin-bottom:1.5rem}
      #boot-splash .bs-title{font-size:1.875rem;font-weight:700;letter-spacing:-.025em;margin:0 0 .375rem}
      #boot-splash .bs-tagline{font-size:.875rem;font-weight:500;color:var(--mut);margin:0}
      .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border-width:0}
      .no-js-fallback{padding:1.5rem;background:var(--bg);color:var(--fg)}
      .no-js-fallback h1{font-size:1.75rem;font-weight:700;margin:0 0 .75rem;letter-spacing:-.02em}
      .no-js-fallback h2{font-size:1.25rem;font-weight:700;margin:1.5rem 0 .5rem}
      .no-js-fallback h3{font-size:1rem;font-weight:600;margin:1rem 0 .5rem}
      .no-js-fallback p{line-height:1.7;max-width:65ch;margin:0 0 .75rem}
      .no-js-fallback ul{padding-left:1.25rem;margin:0 0 1rem}
      .no-js-fallback li{margin-bottom:.35rem;line-height:1.5}
      .no-js-fallback nav a{display:inline-block;margin-right:1rem;margin-bottom:.5rem;color:var(--pri);text-decoration:underline}
      .no-js-fallback nav a:hover{color:var(--fg)}
    </style>

    <!-- When JavaScript is disabled, hide the boot splash so the fallback below stays readable. -->
    <noscript>
      <style>#boot-splash{display:none !important}</style>
    </noscript>

    <!-- Apply theme before first paint to avoid a flash of the wrong colour scheme -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('maina_theme_mode') || 'system'
          var d = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (s === 'dark' || (s === 'system' && d)) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>

    <!-- Non-blocking stylesheet + asset preloads injected by vite (asset-loading-optimizations) -->

    <!-- Structured Data (JSON-LD) for Search Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Maina Voice",
      "url": "https://mainavoice.lat/",
      "operatingSystem": "All (Web & PWA)",
      "applicationCategory": "ProductivityApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "Speech-to-text dictation and multi-model benchmarking app with local IndexedDB storage.",
      "featureList": [
        "Speech to text recording",
        "Multi-engine speed comparison",
        "Devanagari to Urdu transliteration",
        "English translation via OpenRouter",
        "ZIP file backup and restore"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Maina Voice",
      "url": "https://mainavoice.lat/",
      "logo": "https://mainavoice.lat/pwa-512x512.png",
      "description": "Open-source local-first speech-to-text dictation and multi-engine benchmarking project.",
      "sameAs": [
        "https://github.com/alwaisy/mainavoice-web"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "support@mainavoice.lat",
        "url": "https://mainavoice.lat/contact",
        "areaServed": "Worldwide",
        "availableLanguage": ["English"]
      },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Remote-first",
        "addressCountry": "PK"
      }
    }
    </script>
  </head>

  <body class="bg-background text-foreground antialiased selection:bg-primary/20 selection:text-primary">
    <!-- Static boot splash: paints immediately so FCP/LCP do not wait on JS.
         Removed by splash-screen.vue on mount. -->
    <div id="boot-splash">
      <div class="bs-box">
        <svg viewBox="0 0 24 24" fill="none" width="40" height="40" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="2" width="6" height="11" rx="3" fill="currentColor" stroke="none" />
          <path d="M5 11a7 7 0 0 0 14 0" />
          <line x1="12" y1="18" x2="12" y2="22" />
          <line x1="8" y1="22" x2="16" y2="22" />
        </svg>
      </div>
      <p class="bs-title">Maina Voice</p>
      <p class="bs-tagline">AI Voice Dictation</p>
      <span class="sr-only">Local-first speech-to-text and benchmarking app.</span>
    </div>

    <!-- No-JS fallback: full content for crawlers and users with JavaScript disabled.
         Hidden from normal users by the splash screen, which is removed by the Vue app on mount. -->
    <noscript>
      <main class="no-js-fallback" role="main">
        <article class="max-w-3xl mx-auto">
          <h1>Maina Voice — AI Voice Dictation &amp; Engine Benchmarking</h1>
          <p>
            Maina Voice is a local-first, browser-based speech-to-text workbench. Record audio in your
            browser, compare OpenAI GPT-Transcribe, Deepgram Nova-3, NVIDIA Parakeet, Fish Audio and Groq
            Whisper, and keep every recording, transcript and setting in your own IndexedDB. Your audio is
            sent directly from your device to the provider you choose using your own API key. There is no
            account, no analytics beacon and no first-party backend that stores your data.
          </p>

          <h2>What you can do without signing up</h2>
          <ul>
            <li>Record from your microphone or upload an existing audio file.</li>
            <li>Run the same clip through multiple speech-to-text engines and compare speed, cost and quality.</li>
            <li>Track every transcript edit and re-transcription as a versioned history.</li>
            <li>Export your entire library as a ZIP backup, or import it again on any device.</li>
          </ul>

          <h3>Compare engines side by side</h3>
          <p>
            The Compare view benchmarks OpenAI GPT-Transcribe, Deepgram Nova-3, NVIDIA Parakeet TDT v3,
            Fish Audio Transcribe-1 and Groq Whisper Large v3 Turbo on the same recording so you can see
            latency, estimated price and output quality before choosing a provider for your workflow.
          </p>

          <h3>Privacy by design</h3>
          <p>
            Recordings, WAV blobs, generated transcripts, translations, comparison results and application
            settings live in the IndexedDB inside your own browser. Maina Voice never proxies, logs or
            stores your audio on its own servers.
          </p>

          <h2>Get started</h2>
          <p>
            Enable JavaScript for the full app, or read the About, Privacy and Contact pages to learn more
            about the project and how your data is handled.
          </p>

          <nav aria-label="Static fallback navigation">
            <a href="/">Record</a>
            <a href="/compare">Compare</a>
            <a href="/history">History</a>
            <a href="/about">About</a>
            <a href="/privacy">Privacy</a>
            <a href="/contact">Contact</a>
          </nav>
        </article>
      </main>
    </noscript>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
